deploy_job:
  stage: deploy
  image: alpine:latest
  script:
    - apk add --no-cache openssh-client rsync
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    
    # 1. Check if the file actually exists and looks like a key
    - ls -l "$SSH_PRIVATE_KEY"
    - head -n 1 "$SSH_PRIVATE_KEY"
    
    # 2. Fix permissions
    - chmod 400 "$SSH_PRIVATE_KEY"
    
    # 3. Add the host key
    - ssh-keyscan -H "$VM_IP" >> ~/.ssh/known_hosts
    
    # 4. Try the transfer
    - rsync -avz -e "ssh -i $SSH_PRIVATE_KEY -o StrictHostKeyChecking=no" ./ "$VM_USER@$VM_IP:/home/$VM_USER/app/"