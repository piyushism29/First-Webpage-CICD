stages:
  - deploy

deploy:
  stage: deploy
  image: alpine:latest

  before_script:
    - apk add --no-cache openssh rsync
    - echo "$SSH_PRIVATE_KEY" > key.pem
    - chmod 700 key.pem
    - mkdir -p ~/.ssh
    - ssh-keyscan -H "$VM_IP" >> ~/.ssh/known_hosts

  script:
    - rsync -avz -e "ssh -i key.pem" ./ "$VM_USER@$VM_IP:/home/$VM_USER/app/"
    - |
      ssh -i key.pem "$VM_USER@$VM_IP" << 'EOF'
        cd /home/$VM_USER/app
        pkill node || true
        nohup node app.js > output.log 2>&1 &
      EOF