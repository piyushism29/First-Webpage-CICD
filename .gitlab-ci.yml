stages:

. deploy

deploy:
stage: deploy
image: alpine:latest

before_script:
- apk add --no-cache openssh rsync

# Setup SSH key
- echo "$SSH_PRIVATE_KEY" > key.pem
- chmod 600 key.pem

# Known hosts
- mkdir -p ~/.ssh
- ssh-keyscan -H $VM_IP >> ~/.ssh/known_hosts

script:
# Copy project files to VM
- rsync -avz -e "ssh -i key.pem" ./ $VM_USER@$VM_IP:/home/$VM_USER/app/

# SSH and run app
- |
  ssh -i key.pem $VM_USER@$VM_IP << EOF
    cd /home/$VM_USER/app

    # Kill old app if running
    pkill node || true

    # Start app
    nohup node app.js > output.log 2>&1 &
  EOF

