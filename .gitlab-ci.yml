deploy_job:
  stage: deploy
  image: alpine:latest
  script:
    - apk add --no-cache openssh-client rsync
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - ssh-keyscan -H "$VM_IP" >> ~/.ssh/known_hosts
    
    # Since the type is now "File", we just set the permissions on that file
    - chmod 400 "$SSH_PRIVATE_KEY"

    # Use the variable directly (it now acts as a file path)
    - rsync -avz -e "ssh -i $SSH_PRIVATE_KEY -o StrictHostKeyChecking=no" ./ "$VM_USER@$VM_IP:/home/$VM_USER/app/"
